[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-scibuddy"
version = "0.1.0"
description = "Standalone double-recursive RSI experiments on scientific tasks"
requires-python = ">=3.12,<3.13"
dependencies = ["jsonschema>=4"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11"]
data = ["pyarrow>=19"]
train = ["skyrl[fsdp]", "pysocks", "socksio", "vllm==0.28.0; sys_platform == 'linux'", "vllm-router; sys_platform == 'linux'", "nixl; sys_platform == 'linux'", "flash-linear-attention; sys_platform == 'linux'", "causal-conv1d==1.6.2.post1+cu.13.0.torch.2.11; sys_platform == 'linux'", "flash-attn==2.8.3+cu.13.0.torch.2.11; sys_platform == 'linux'", "torch==2.11.0; sys_platform == 'linux'", "flashinfer-python==0.6.16.post3; sys_platform == 'linux' and platform_machine == 'x86_64'", "flashinfer-jit-cache==0.6.16.post3; sys_platform == 'linux' and platform_machine == 'x86_64'", "flashinfer-cubin==0.6.16.post3; sys_platform == 'linux' and platform_machine == 'x86_64'", "torchvision; sys_platform == 'linux'"]

[project.scripts]
simple-scibuddy = "simple_scibuddy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
include = ["src/**/*.py", "tests/**/*.py"]

[tool.uv]
# Keep these sources and overrides aligned with the pinned SkyRL CUDA stack.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

no-build-isolation-package = [
    "nv-grouped-gemm",
]
override-dependencies = [
    "nvidia-resiliency-ext; sys_platform == 'never'",
    "transformer-engine[pytorch]==2.16.0; sys_platform == 'linux'",
    "transformers>=5.6.1,<=5.16.1; sys_platform == 'linux'",
    "megatron-core>=0.16.0; sys_platform == 'linux' and python_version >= '3.12'",
    "ml_dtypes>=0.5.0; sys_platform == 'linux'",
    "nixl-cu12; sys_platform == 'never'",
    "flashinfer-python==0.6.16.post3; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "flashinfer-jit-cache==0.6.16.post3; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "flashinfer-cubin==0.6.16.post3; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "tilelang==0.1.9; sys_platform == 'linux'",
    "apache-tvm-ffi==0.1.10; sys_platform == 'linux'",
    "xgrammar==0.2.3",
    "torch==2.11.0; sys_platform == 'linux'",
    "torchvision==0.26.0; sys_platform == 'linux'",
]

[tool.uv.extra-build-dependencies]
flash-attn = [{requirement = "torch", match-runtime = true}]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "jax-tpu"
url = "https://storage.googleapis.com/jax-releases/libtpu_releases.html"

[[tool.uv.index]]
name = "flashinfer-cu130"
url = "https://flashinfer.ai/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "flashinfer"
url = "https://flashinfer.ai/whl/"
explicit = true

[[tool.uv.index]]
name = "astral-cu130"
url = "https://wheels.astral.sh/simple/cu130/"
explicit = true

[tool.uv.sources]
skyrl = { path = "skyrl", editable = true }
skyrl-gym = { path = "skyrl/skyrl-gym", editable = true }
flashinfer-jit-cache = { index = "flashinfer-cu130", marker = "sys_platform == 'linux'" }
flashinfer-cubin = { index = "flashinfer", marker = "sys_platform == 'linux'" }

flash-attn = { index = "astral-cu130", marker = "sys_platform == 'linux'" }
causal-conv1d = { index = "astral-cu130", marker = "sys_platform == 'linux'" }
mamba-ssm = { index = "astral-cu130", marker = "sys_platform == 'linux'" }
transformer-engine = { index = "astral-cu130", marker = "sys_platform == 'linux'" }
transformer-engine-cu13 = { index = "astral-cu130", marker = "sys_platform == 'linux'" }
transformer-engine-torch = { index = "astral-cu130", marker = "sys_platform == 'linux'" }
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
]
vllm-router = [
    { url = "https://github.com/SumanthRH/router/releases/download/0.1.14.post1/vllm_router-0.1.14.post1-cp38-abi3-linux_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { url = "https://github.com/SumanthRH/router/releases/download/0.1.14.post1/vllm_router-0.1.14.post1-cp38-abi3-manylinux_2_28_aarch64.whl", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" }
]
[[tool.uv.dependency-metadata]]
name = "flashinfer-cubin"
version = "0.6.16.post3"
requires-python = ">=3.8"
requires-dist = []

[[tool.uv.dependency-metadata]]
name = "flashinfer-jit-cache"
version = "0.6.16.post3+cu130"
requires-python = ">=3.9"
requires-dist = []

[[tool.uv.dependency-metadata]]
name = "torch"
version = "2.11.0+cu130"
requires-python = ">=3.10"
requires-dist = ["filelock", "typing-extensions>=4.10.0", "setuptools<82", "sympy>=1.13.3", "networkx>=2.5.1", "jinja2", "fsspec>=0.8.5", "cuda-toolkit[cublas,cudart,cufft,cufile,cupti,curand,cusolver,cusparse,nvjitlink,nvrtc,nvtx]==13.0.2; platform_system == \"Linux\"", "cuda-bindings<14,>=13.0.3; platform_system == \"Linux\"", "nvidia-cudnn-cu13==9.19.0.56; platform_system == \"Linux\"", "nvidia-cusparselt-cu13==0.8.0; platform_system == \"Linux\"", "nvidia-nccl-cu13==2.28.9; platform_system == \"Linux\"", "nvidia-nvshmem-cu13==3.4.5; platform_system == \"Linux\"", "triton==3.6.0; platform_system == \"Linux\"", "optree>=0.13.0; extra == \"optree\"", "opt-einsum>=3.3; extra == \"opt-einsum\"", "pyyaml; extra == \"pyyaml\""]
provides-extra = ["optree", "opt-einsum", "pyyaml"]

[[tool.uv.dependency-metadata]]
name = "torchvision"
version = "0.26.0+cu130"
requires-python = ">=3.10,!=3.14.1"
requires-dist = ["numpy", "torch (==2.11.0)", "pillow (!=8.3.*,>=5.3.0)", "gdown (>=4.7.3) ; extra == 'gdown'", "scipy ; extra == 'scipy'"]
provides-extra = ["gdown", "scipy"]

[[tool.uv.dependency-metadata]]
name = "flash_attn"
version = "2.8.3+cu.13.0.torch.2.11"
requires-python = ">=3.9"
requires-dist = ["torch ==2.11.*", "einops"]
provides-extra = []

[[tool.uv.dependency-metadata]]
name = "causal_conv1d"
version = "1.6.2.post1+cu.13.0.torch.2.11"
requires-python = ">=3.9"
requires-dist = ["torch==2.11.*", "packaging", "ninja"]
provides-extra = []
