# Harness-only reproduction against the id200-val30-test30-v2 release.
#
#   bash deploy/start_run.sh configs/h-only-v2.toml id200-val30-test30-v2 id200-val30-test30-v1
#
# v2 differs from v1 only in how the 260 tasks are split; the source data, the family
# proportions and every budget below are unchanged. The v1 split let split_by_group hand
# whole subtasks to one split, so val and test stopped measuring the same thing:
#   - val was 17/17 variant_from_sequence, test was 15/17 vax_response
#   - "always pick the longest option" scored 60% on val and 20% on test
#   - the improver never saw a single example of the two subtasks that produced 16 of the
#     18 tasks gained on test
# v2 deals whole source_groups stratified by (subtask, is-the-correct-option-longest), so
# all three splits carry the same subtask mix and the same length bias.
mode = "harness_evolve"
experiment = "../runs/h-only-v2"

[model]
mode = "train"
steps = 30
checkpoint_interval = 0
eval_interval = 30
concurrency = 16
tool_seconds = 60

[harness_evolve]
selection_tasks = 30              # must equal the val split size (phase.py:126-127 enforces it)
candidates = 3
workers = 16
feedback_every = 16               # upstream default; train has 200 tasks so 3 x 16 = 48 does not wrap
# preflight_task_id omitted: phase.py:187 falls back to train[0]. A hardcoded ID belongs to
# one release's train split and trips "Preflight task must belong to training split" after a
# release change.
steps_per_phase = 3
user_turns = 1
actions = 9
max_tokens = 4096
context_tokens = 24576
seed = 20260911                   # same SPLIT_SEED the release was built with
tool_response_tokens = 2048
tool_history_tokens = 8192

[harness_evolve.improver]
backend = "remote"
base_url = "https://dashscope-intl.aliyuncs.com/compatible-mode/v1"
model = "qwen3.8-max"             # the paper uses GPT-6 Astra; this is the accessible substitute, declare it
reasoning_effort = "medium"
api_key_env = "SCIENCEBUDDY_IMPROVER_API_KEY"
max_tokens = 8192

[coevolve]
worker_id = "rl-01"
max_rounds = 3
trigger = "always_debug"
