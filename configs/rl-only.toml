# Reduced-scale reproduction against the adapter-rebuilt id40-val10-test10-v1 release.
# Model training only, harness frozen -- this tests the paper's second claim
# (Sec 4.4, pass@4 +19.5pp).
# Upstream configs/train.toml is left untouched as the reference; do not overwrite it.
#
#   python scripts/train.py configs/rl-only.toml
#
# Every difference from the upstream defaults carries its reason at the end of the line.
mode = "model"
experiment = "../runs/rl-only-v2"

[model]
mode = "train"
steps = 30                        # Sec 4.4 uses roughly 2 hours; get it running first, then extend
checkpoint_interval = 0
eval_interval = 30
concurrency = 16                  # 4 engines on 4 GPUs, so 4 episodes per engine -- the ratio that
                                  # cleared the 900s episode budget on the harness side
tool_seconds = 60

[harness_evolve]
selection_tasks = 30              # must equal the val split size (phase.py:126-127 enforces it)
candidates = 3
workers = 16                      # upstream uses 64; matched to --cpus-per-task=16
feedback_every = 8                # upstream uses 16; train has only 40 tasks, so 3 x 16 = 48 would wrap
steps_per_phase = 3
user_turns = 1
actions = 9
max_tokens = 4096
context_tokens = 24576
seed = 20260911                   # matches SPLIT_SEED in adapter/config.py
tool_response_tokens = 2048
tool_history_tokens = 8192

[harness_evolve.improver]
backend = "remote"
base_url = "https://dashscope-intl.aliyuncs.com/compatible-mode/v1"
model = "qwen3.8-max"             # the paper uses GPT-6 Astra; this is the accessible substitute, declare it
reasoning_effort = "medium"       # verified accepted by DashScope (non-OpenAI providers often reject it)
api_key_env = "SCIENCEBUDDY_IMPROVER_API_KEY"
max_tokens = 8192

[coevolve]
worker_id = "rl-01"
max_rounds = 3
trigger = "always_debug"
